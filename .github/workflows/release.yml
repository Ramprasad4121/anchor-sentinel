name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/anchor-sentinel scan tests/test_contracts/vulnerable_vault.rs --format json > /dev/null

      - name: Package
        shell: bash
        run: |
          name=anchor-sentinel-${TAG}-${{ matrix.target }}
          mkdir dist
          cp target/${{ matrix.target }}/release/anchor-sentinel LICENSE README.md dist/
          tar czf ${name}.tar.gz -C dist anchor-sentinel LICENSE README.md
          shasum -a 256 ${name}.tar.gz > ${name}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            anchor-sentinel-*.tar.gz
            anchor-sentinel-*.tar.gz.sha256
